<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>IRLY Girl 30s</title><link rel="stylesheet" href="video.css">
<style>
.gcap { position: absolute; left: 72px; width: 900px; margin: 0; font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 112px; line-height: 0.98; letter-spacing: -0.015em; }
.gcap .it { font-style: italic; }
.pearl { background: #FBF2F4; color: #2F1B29; }
</style></head>
<body><div class="frame" style="background:#FBF2F4">

  <!-- 0–4 s: a new city, alone -->
  <section class="scene" id="s1">
    <img class="cover layer" id="s1bg" src="../assets/photos/readingGirl.jpg" alt="" style="object-position: 50% 45%">
    <div class="abs" style="inset:0; background: linear-gradient(180deg, rgba(36,18,30,0.70) 0%, rgba(36,18,30,0.25) 34%, rgba(36,18,30,0.05) 55%, rgba(36,18,30,0.55) 100%)"></div>
    <h1 class="gcap" id="s1a" style="top:200px; color:#FFF6FA">Nouvelle ville. <span class="it">Nouvelle vie.</span></h1>
    <p class="gcap" id="s1b" style="top:470px; font-size:76px; color:#FFF6FA">Mais où rencontrer ses futures amies&nbsp;?</p>
  </section>

  <!-- 4–8 s: IRLY Girl appears -->
  <section class="scene pearl" id="s2">
    <div class="glow" style="left:-300px; top:-260px; width:1100px; height:1100px; background: radial-gradient(circle, rgba(232,76,140,0.34), rgba(232,76,140,0) 66%)"></div>
    <div class="glow" style="right:-360px; top:800px; width:1200px; height:1200px; background: radial-gradient(circle, rgba(240,206,188,0.85), rgba(240,206,188,0) 66%)"></div>
    <div class="abs" style="left:72px; top:200px; display:flex; align-items:flex-end; gap:16px">
      <div id="s2logo" data-logo="56" data-ink="#4A2440" data-accent="#E83E87"></div>
      <span id="s2girl" class="serif it" style="font-size:88px; line-height:0.8; color:#E83E87">Girl</span>
    </div>
    <h1 class="gcap" id="s2cap" style="top:330px">Découvre <span class="it" style="color:#B92B69">IRLY Girl.</span></h1>
    <div class="vphone light" id="s2phone" style="left:250px; top:580px; width:580px"><div class="screen"><img id="s2img" alt=""></div></div>
  </section>

  <!-- 8–14 s: communities -->
  <section class="scene pearl" id="s3">
    <div class="glow" style="right:-300px; top:-200px; width:1000px; height:1000px; background: radial-gradient(circle, rgba(232,76,140,0.28), rgba(232,76,140,0) 66%)"></div>
    <div class="glow" style="left:-300px; top:1000px; width:1100px; height:1100px; background: radial-gradient(circle, rgba(176,132,190,0.30), rgba(176,132,190,0) 66%)"></div>
    <h1 class="gcap" id="s3cap" style="top:200px">Des femmes qui partagent <span class="it" style="color:#B92B69">tes envies.</span></h1>
    <div class="vphone light" id="s3phone" style="left:80px; top:600px; width:540px"><div class="screen"><img id="s3img" alt=""></div></div>
    <div class="card" id="s3card" style="left:440px; top:1160px; width:600px; border-radius: 56px; box-shadow: 0 40px 90px rgba(46,22,40,0.28)">
      <img src="../assets/shots/girl/girl_comm_s1.png" alt="" id="s3cardimg">
    </div>
  </section>

  <!-- 14–20 s: activities, outings, trips -->
  <section class="scene" id="s4" style="background:#24121E">
    <img class="cover layer" id="q1" src="../assets/photos/yachtGirl.jpg" alt="">
    <img class="cover layer" id="q2" src="../assets/photos/desertSunsetGirl.jpg" alt="">
    <img class="cover layer" id="q3" src="../assets/photos/beachClubGirl.jpg" alt="">
    <img class="cover layer" id="q4" src="../assets/photos/tennisGirl.jpg" alt="">
    <img class="cover layer" id="q5" src="../assets/photos/girlsOut.jpg" alt="">
    <div class="abs" style="inset:0; background: linear-gradient(180deg, rgba(36,18,30,0.78) 0%, rgba(36,18,30,0.30) 30%, rgba(36,18,30,0) 50%, rgba(36,18,30,0.55) 100%)"></div>
    <h1 class="gcap" id="w1" style="top:200px; color:#FFF6FA">Des activités.</h1>
    <h1 class="gcap" id="w2" style="top:320px; color:#FFF6FA">Des sorties.</h1>
    <h1 class="gcap" id="w3" style="top:440px; color:#F6C5D8"><span class="it">Des amitiés.</span></h1>
  </section>

  <!-- 20–25 s: Girl Network -->
  <section class="scene" id="s5" style="background:#F6F2FF; color:#211634">
    <div class="glow" style="left:-300px; top:-260px; width:1100px; height:1100px; background: radial-gradient(circle, rgba(124,77,255,0.30), rgba(124,77,255,0) 66%)"></div>
    <div class="glow" style="right:-360px; top:800px; width:1200px; height:1200px; background: radial-gradient(circle, rgba(190,212,255,0.80), rgba(190,212,255,0) 66%)"></div>
    <h1 class="gcap" id="s5cap" style="top:200px; font-size:100px">Un réseau féminin pour <span class="it" style="color:#6A3BEE">aller plus loin.</span></h1>
    <div class="vphone violet" id="s5phone" style="left:250px; top:640px; width:560px"><div class="screen"><img id="s5img" alt=""></div></div>
    <div class="card" id="s5card" style="left:70px; top:1080px; width:760px; border-radius: 64px; box-shadow: 0 40px 100px rgba(45,29,84,0.30)">
      <img src="../assets/shots/girl/girl_network_person.png" alt="" id="s5cardimg">
    </div>
  </section>

  <!-- 25–30 s: signature -->
  <section class="scene pearl" id="s6">
    <div class="glow" style="left:-300px; top:200px; width:1500px; height:1500px; background: radial-gradient(circle, rgba(232,76,140,0.26), rgba(232,76,140,0) 60%)"></div>
    <div class="glow" style="right:-300px; top:900px; width:1100px; height:1100px; background: radial-gradient(circle, rgba(240,206,188,0.80), rgba(240,206,188,0) 64%)"></div>
    <div class="abs" style="left:0; width:1080px; top:640px; display:flex; justify-content:center; align-items:flex-end; gap:26px">
      <div id="s6logo" data-logo="150" data-ink="#4A2440" data-accent="#E83E87"></div>
      <span id="s6girl" class="serif it" style="font-size:210px; line-height:0.78; color:#E83E87">Girl</span>
    </div>
    <p class="abs serif" id="s6tag" style="left:0; width:1080px; top:1000px; margin:0; text-align:center; font-size:96px; color:#2F1B29">Find your <span class="it" style="color:#B92B69">people.</span></p>
    <div class="abs" id="s6soon" style="left:0; width:1080px; top:1170px; display:flex; justify-content:center"><div class="pill" style="background: linear-gradient(180deg, #D63A7E, #B92B69 55%, #9E2358); color:#FFFFFF; box-shadow: 0 12px 26px rgba(185,43,105,0.30)">Bientôt disponible à Dubaï</div></div>
  </section>
</div>
<script src="../images/common.js"></script>
<script src="engine.js"></script>
<script>
const $ = (id) => document.getElementById(id);
seq('ghome', '../assets/clips/g_home', 120);
seq('gcomm', '../assets/clips/g_comm', 120);
seq('gnet', '../assets/clips/g_network', 90);
seq('gperson', '../assets/clips/g_person', 60);

function sizeCard(img, { x, y, w, h }, width) {
  const s = width / w;
  img.style.width = `${390 * s}px`;
  img.style.left = `${-x * s}px`;
  img.style.top = `${-y * s}px`;
  img.parentElement.style.height = `${h * s}px`;
}
sizeCard($('s3cardimg'), { x: 20, y: 458, w: 350, h: 147 }, 600);
sizeCard($('s5cardimg'), { x: 18, y: 487, w: 347, h: 154 }, 760);

const frameScene = (el, lt, dur, inD = 0.45, outD = 0.35) => {
  const k = prog(lt, 0, inD, ease.out);
  const o = 1 - prog(lt, dur - outD, dur, ease.in);
  // Settles in from 1.04, then a slow camera drift so no shot ever sits still.
  style(el, { o: k * o, s: (1.04 - 0.04 * k) * (1 + 0.025 * clamp(lt / dur)) });
};

scene('s1', 0, 4.25, async (lt, t, dur) => {
  $('s1').style.opacity = String(1 - prog(lt, dur - 0.4, dur, ease.in));
  style($('s1bg'), { s: 1.14 - 0.1 * prog(lt, 0, dur, ease.inOut) });
  words($('s1a'), lt, 0.35, { stagger: 0.09 });
  words($('s1b'), lt, 1.6, { stagger: 0.07 });
});
scene('s2', 3.9, 8.25, async (lt, t, dur) => {
  frameScene($('s2'), lt, dur);
  logoReveal($('s2logo'), lt, 0.25, { sweep: 0.5, accentAt: 0.6 });
  const g = prog(lt, 0.7, 1.2, ease.out);
  style($('s2girl'), { o: g, y: (1 - g) * 30 });
  words($('s2cap'), lt, 0.55);
  const k = prog(lt, 0.2, 1.15, ease.spring);
  style($('s2phone'), { y: (1 - k) * 900, r: (1 - k) * -6 });
  await phonePlay($('s2img'), lt, [{ at: 0, until: 1.0, still: '../assets/clips/g_home/00000.jpg' }, { at: 1.0, seq: 'ghome', speed: 1.1 }]);
});
scene('s3', 7.9, 14.25, async (lt, t, dur) => {
  frameScene($('s3'), lt, dur);
  words($('s3cap'), lt, 0.3, { stagger: 0.07 });
  const k = prog(lt, 0.1, 0.9, ease.out);
  style($('s3phone'), { x: (1 - k) * -120, o: k });
  const c = prog(lt, 3.3, 4.0, ease.spring);
  style($('s3card'), { x: (1 - c) * 500, o: clamp(c * 2), r: 2 * c });
  await phonePlay($('s3img'), lt, [{ at: 0, until: 0.5, still: '../assets/clips/g_comm/00000.jpg' }, { at: 0.5, seq: 'gcomm', speed: 0.95 }]);
});
scene('s4', 13.9, 20.25, async (lt, t, dur) => {
  frameScene($('s4'), lt, dur, 0.3);
  ['q1', 'q2', 'q3', 'q4', 'q5'].forEach((id, i) => {
    const a = i * 1.2;
    const on = lt >= a - 0.12 && (i === 4 || lt < a + 1.2);
    $(id).style.opacity = on ? String(prog(lt, a - 0.12, a + 0.12, ease.linear)) : '0';
    style($(id), { s: 1.12 - 0.07 * prog(lt, a, a + 1.4, ease.linear) });
  });
  words($('w1'), lt, 0.35);
  words($('w2'), lt, 1.7);
  words($('w3'), lt, 3.1);
});
scene('s5', 19.9, 25.25, async (lt, t, dur) => {
  frameScene($('s5'), lt, dur);
  words($('s5cap'), lt, 0.3, { stagger: 0.07 });
  const k = prog(lt, 0.1, 1.0, ease.out);
  style($('s5phone'), { y: (1 - k) * 200, o: k });
  const c = prog(lt, 3.2, 3.9, ease.spring);
  style($('s5card'), { y: (1 - c) * 300, o: clamp(c * 2), s: 0.92 + 0.08 * c });
  await phonePlay($('s5img'), lt, [{ at: 0, until: 2.3, seq: 'gnet', speed: 1.2 }, { at: 2.3, seq: 'gperson', speed: 0.9 }]);
});
scene('s6', 24.9, 30.1, async (lt, t, dur) => {
  frameScene($('s6'), lt, dur, 0.4, 0.01);
  logoReveal($('s6logo'), lt, 0.2, { sweep: 0.6, accentAt: 0.75 });
  const g = prog(lt, 0.8, 1.4, ease.out);
  style($('s6girl'), { o: g, y: (1 - g) * 40 });
  const k = prog(lt, 1.4, 2.0, ease.out);
  style($('s6tag'), { o: k, y: (1 - k) * 30 });
  const p = prog(lt, 1.8, 2.3, ease.spring);
  style($('s6soon'), { o: clamp(p * 2), s: 0.9 + 0.1 * p });
});
</script></body></html>
