# Les vérifications de LinkFoot.
#
# À chaque push et chaque pull request : les onze vérifications rapides, huit minutes.
# Elles protègent ce qui casse le plus souvent sans qu'on le voie : le canvas qui
# diverge du moteur, le serveur qui accepte une triche, un match découpé qui ne donne
# plus le même score, un pack dont les probabilités affichées ne sont plus celles du
# tirage.
#
# Chaque lundi, et à la demande : les trois longues, qui jouent des centaines de
# matchs pour vérifier l'équilibre du jeu (les leviers tactiques, la valeur des cartes,
# les promesses des styles). Trop lentes pour chaque push, indispensables avant de
# toucher au moteur.
name: Vérifications

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      longues:
        description: 'Lancer aussi les vérifications longues (une demi-heure)'
        type: boolean
        default: true
  schedule:
    - cron: '17 4 * * 1'

jobs:
  rapides:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Les onze vérifications rapides
        run: node test/tout.js

  longues:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.longues)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Toutes les vérifications, longues comprises
        run: node test/tout.js --long

  # L'application, lancée pour de vrai dans un navigateur : premier lancement, les six
  # onglets, un pack ouvert, le onze choisi, un match en direct avec un remplacement et
  # une consigne, la division qui avance, second lancement. Compiler ne prouve rien sur ce qu'un
  # joueur voit ; c'est ce job qui a trouvé que l'app ne se construisait pas et
  # qu'elle ne créait jamais le club.
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dépendances de l'app
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Navigateur
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: L'app, comme un joueur la verrait
        working-directory: app
        run: npm run verifier

  # Le cœur C++ de LinkFoot pour Unreal, compilé et testé hors d'Unreal sur trois vrais
  # matchs et les seize scènes (gcc puis clang, avertissements en erreurs), et la couche
  # Unreal vérifiée en syntaxe contre les déclarations relevées dans la référence
  # d'Unreal 5.8. Ce job ne compile pas avec Unreal : aucun exécuteur GitHub ne l'a.
  unreal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Outils
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: Le cœur, avec gcc
        run: |
          cmake -S unreal/tests-coeur -B build/coeur-gcc -G Ninja -DCMAKE_CXX_COMPILER=g++
          cmake --build build/coeur-gcc
          ctest --test-dir build/coeur-gcc --output-on-failure
      - name: Le cœur, avec clang
        run: |
          cmake -S unreal/tests-coeur -B build/coeur-clang -G Ninja -DCMAKE_CXX_COMPILER=clang++
          cmake --build build/coeur-clang
          ctest --test-dir build/coeur-clang --output-on-failure
      - name: La couche Unreal, en syntaxe
        run: python3 unreal/verif-syntaxe/verifier.py
